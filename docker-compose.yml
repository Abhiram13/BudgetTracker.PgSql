name: budget-tracker
version: "3.9"

services:
    budget-tracker-gateway:
        build:
            dockerfile: Src/BudgetTracker.Gateway/Dockerfile
            target: dev
            args:
                NUGET_PAT: ${NUGET_PAT}
                APP_ENV: Development
        image: budget-tracker-gateway
        ports:
            - "3000:3000"
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ReverseProxy__Clusters__finance-cluster__Destinations__instance-01__Address: http://budget-tracker-finance:3001
            ENV: Development
            GOOGLE_APPLICATION_CREDENTIALS: /gcp/credentials.json
        volumes:
            - type: bind
              source: /Volumes/SecureDisk/budget-tracker-453204-64c2649cc266.json
              target: /gcp/credentials.json
              read_only: true
            - type: bind
              source: /Volumes/SecureDisk/bt-gateway-local-secrets.json
              target: /secrets/gateway-secrets.json
              read_only: true
            - type: bind
              source: .
              target: /budget-tracker                          
    
    budget-tracker-finance:
        build:
            dockerfile: Src/BudgetTracker.Finance/Dockerfile
            args:
                NUGET_PAT: ${NUGET_PAT}
                APP_ENV: Development
        image: budget-tracker-finance
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ENV: Development
            Postgres__Write__Host: host.docker.internal # <-- host.docker.internal = computer's localhostOkat
            Postgres__Read__Host: host.docker.internal
            Postgres__Migrate__Host: host.docker.internal            
            GOOGLE_CLOUD_PROJECT_ID: budget-tracker-453204
            PORT: 3001
        volumes:
            - type: bind
              source: /Volumes/SecureDisk/finance-local-secrets.json
              target: /secrets/finance-secrets.json
              read_only: true