steps:
  # Step 1: Build the Docker image and pass NUGET_PAT as build arg
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Build'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$_PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA'
      - '-f'
      - 'Src/BudgetTracker.Finance/Dockerfile'
      - '--build-arg'
      - 'NUGET_PAT=$_NUGET_PAT'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Push'
    args: ['push', '$_LOCATION-docker.pkg.dev/$_PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Deploy to Cloud run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'budget-tracker-finance'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$_PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA'
      - '--region'
      - '$_LOCATION'
      - '--platform'
      - 'managed'
      - --allow-unauthenticated
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT_ID=$_PROJECT_ID'
      - '--set-env-vars'
      - 'POSTGRES_HOST=$_POSTGRES_HOST'
      - '--set-env-vars'
      - 'POSTGRES_DATABASE=$_POSTGRES_DATABASE'
      - '--set-env-vars'
      - 'POSTGRES_USERNAME=$_POSTGRES_USERNAME'
      - '--set-env-vars'
      - 'POSTGRES_PASSWORD=$_POSTGRES_PASSWORD'
      - '--set-env-vars'
      - 'POSTGRES_WRITE_PORT=$_POSTGRES_WRITE_PORT'
      - '--set-env-vars'
      - 'PUB_SUB_TOPIC=$_PUB_SUB_TOPIC'
      - '--set-env-vars'
      - 'YARP_API_KEY=123'

# Optional: declare the image for metadata
images:
    - '$_LOCATION-docker.pkg.dev/$_PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA'

options:
    logging: CLOUD_LOGGING_ONLY